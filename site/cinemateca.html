<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cinemateca Estranha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: marquise de cinema de repertório — cabeçalho fixo com busca, abas por sessão, tags facetadas, grade de cartazes 2:3 */
:root{
  --bg:#121019; --surface:#1b1824; --raise:#252131; --line:#2f2a3d;
  --fg:#eeeaf4; --muted:#9d96ad; --accent:#f4a640; --on-accent:#1a1206;
  --c-weird:#e86bb3; --c-mundo:#3fc2b0; --c-mindfuck:#9b8cff; --c-horror:#ef5a4f; --c-thelema:#d9b54a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 18px 50px rgb(0 0 0 / .45);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceef3; --surface:#ffffff; --raise:#e2e4ec; --line:#cfd2dd;
  --fg:#17141f; --muted:#5d5870; --accent:#b0600a; --on-accent:#fff;
  --c-weird:#b8327f; --c-mundo:#14806f; --c-mindfuck:#5a48d6; --c-horror:#c0322a; --c-thelema:#8c6c0c;
  --shadow:0 18px 50px rgb(20 18 40 / .18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef3; --surface:#ffffff; --raise:#e2e4ec; --line:#cfd2dd;
  --fg:#17141f; --muted:#5d5870; --accent:#b0600a; --on-accent:#fff;
  --c-weird:#b8327f; --c-mundo:#14806f; --c-mindfuck:#5a48d6; --c-horror:#c0322a; --c-thelema:#8c6c0c;
  --shadow:0 18px 50px rgb(20 18 40 / .18); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:16px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:.9;margin-right:auto}
.brand b{font:900 clamp(26px,4vw,38px)/.9 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.brand .home{color:inherit;text-decoration:none}
.brand small a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.brand small a:hover{color:var(--accent)}
.brand small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.search{position:relative;flex:1 1 340px;max-width:560px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 44px 11px 42px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:15px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none}
.search kbd{position:absolute;right:12px;top:50%;translate:0 -50%;font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.search button.clear{position:absolute;right:8px;top:50%;translate:0 -50%;border:0;background:var(--raise);border-radius:999px;width:28px;height:28px;cursor:pointer}
.tools{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:16px;height:16px;fill:currentColor}

/* Sessões */
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px;cursor:pointer}
.cat b{font:700 19px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.cat i{font:normal 500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--accent));align-self:center}
.cat[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cat[aria-pressed="true"] i{color:inherit;opacity:.7}

/* Tags */
.filters{display:grid;gap:10px;padding-block:14px 6px}
.facet{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.facet h3{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;width:100px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip i{font:normal 11px var(--mono);color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] i{color:inherit}
.chip[role="radio"]::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;align-self:center;opacity:.6}
.chip[role="radio"][aria-checked="true"]::before{background:currentColor;opacity:1}
.chip.more{border-style:dashed;color:var(--muted)}
.toggle-filters{display:none}

.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.count{font:500 13px var(--mono);color:var(--muted);margin-right:auto}
.count b{color:var(--fg);font-weight:500}
.sort{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sort button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.sort button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.reset{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;font-size:13px;padding:6px 0}

/* Seções e grade */
main{padding-block:8px 64px}
.section{padding-top:28px}
.section-head{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font:900 clamp(30px,5vw,52px)/.9 var(--display);text-transform:uppercase;margin:0;letter-spacing:.005em;text-wrap:balance}
.section-head h2::first-letter{color:var(--dot)}
.section-head p{margin:0 0 3px;color:var(--muted);max-width:52ch;flex:1 1 260px}
.section-head .n{font:500 12px var(--mono);color:var(--dot);border:1px solid currentColor;border-radius:4px;padding:2px 7px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;background:none;border:0;padding:0;text-align:left;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:4px;overflow:hidden;background:var(--raise);box-shadow:0 1px 0 var(--line)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .poster img{transform:scale(1.04)}
.poster .play{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;opacity:0;translate:0 6px;transition:.2s;box-shadow:var(--shadow)}
.poster .play svg{width:15px;height:15px;fill:currentColor;margin-left:2px}
.card:hover .play,.card:focus-visible .play{opacity:1;translate:0 0}
@media (hover:none){.poster .play{opacity:1;translate:0 0;width:32px;height:32px}}
.poster .dots{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.poster .dots span{width:9px;height:9px;border-radius:50%;background:var(--d);box-shadow:0 0 0 2px rgb(0 0 0 / .35)}
.poster .flag{position:absolute;left:0;bottom:10px;background:var(--fg);color:var(--bg);font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px 3px 8px;border-radius:0 3px 3px 0}
.card h4{margin:0;font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .meta{font:12px var(--mono);color:var(--muted);margin-top:-4px;overflow-wrap:anywhere}

/* Capa gerada para filmes sem cartaz */
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;background:linear-gradient(160deg,hsl(var(--h) 45% 26%),hsl(calc(var(--h) + 40) 50% 12%));color:#f3eef8}
.gen b{font:900 22px/.95 var(--display);text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.gen span{font:500 11px var(--mono);opacity:.75}

.empty{padding:64px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font:900 34px var(--display);text-transform:uppercase;color:var(--fg)}

/* Ficha do filme */
dialog{border:0;padding:0;background:var(--surface);color:var(--fg);border-radius:10px;width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgb(8 6 14 / .72);backdrop-filter:blur(3px)}
.sheet{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0}
.sheet .poster{border-radius:10px 0 0 10px;height:100%;aspect-ratio:auto;min-height:390px}
.info{padding:26px 28px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.info h2{font:900 clamp(30px,4.5vw,46px)/.92 var(--display);text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere;padding-right:36px}
.aka{color:var(--muted);font-size:14px;margin-top:-6px}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;font:13px var(--mono);color:var(--muted)}
.facts b{color:var(--fg);font-weight:500}
.info .chips{flex:none}
.info .label{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.catpills{display:flex;gap:6px;flex-wrap:wrap}
.catpill{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--dot);color:var(--dot);background:transparent;border-radius:4px;padding:3px 9px;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.note{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .sheet{grid-template-columns:1fr}
  .sheet .poster{border-radius:10px 10px 0 0;min-height:0;aspect-ratio:16/10}
  .sheet .poster img{object-position:center 20%}
  .info{padding:20px 18px}
  .facet h3{width:100%}
  .toggle-filters{display:inline-flex}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
}
/* Palco do trailer e onde assistir */
dialog{width:min(980px,calc(100vw - 24px))}
.stage{position:relative;background:#000;border-radius:10px 10px 0 0;aspect-ratio:16/9;max-width:100%}
.stage video,.stage iframe{width:100%;height:100%;display:block;border:0;border-radius:10px 10px 0 0;background:#000}
.stage + .sheet .poster{border-radius:0 0 0 10px}
.watch{display:grid;gap:8px}
.watch-row{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.watch-row span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:92px;flex:none}
.prov{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);background:var(--raise)}
.prov:hover{border-color:var(--accent)}
.prov.sub{border-color:var(--accent);background:transparent}
.nowatch{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stage + .sheet .poster{border-radius:0}}
/* Barra de filtros compacta */
.fwrap{position:relative;padding-block:14px 2px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 14px;font-size:14px;font-weight:500;cursor:pointer;max-width:100%}
.fbtn:hover{border-color:var(--muted)}
.fbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;opacity:.7;transition:rotate .15s}
.fbtn[aria-expanded="true"]{border-color:var(--fg);anchor-name:--fbtn}
.fbtn[aria-expanded="true"] svg{rotate:180deg}
.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fbtn b{background:var(--accent);color:var(--on-accent);font:600 11px var(--mono);border-radius:999px;padding:1px 6px}
.pop{position:fixed;inset:auto;margin:0;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;flex-direction:column;gap:8px;overflow:visible}
.pop:popover-open{display:flex}
@supports (top:anchor(bottom)){.pop{position-anchor:--fbtn;top:calc(anchor(bottom) + 8px);left:anchor(left);position-try-fallbacks:flip-inline,flip-block}}
.pop-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px}
.pop-head b{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em}
.pop-head button{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.opts{max-height:min(340px,50vh);overflow:auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.opt{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;border:0;background:none;text-align:left;cursor:pointer;font-size:14px}
.opt:hover{background:var(--raise)}
.opt .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:none;display:grid;place-items:center}
.opt[role="radio"] .box{border-radius:50%}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;rotate:45deg;margin-top:-2px}
.opt[role="radio"][aria-checked="true"] .box::after{width:6px;height:6px;border:0;border-radius:50%;background:var(--on-accent);rotate:0deg;margin:0}
.opt .l{flex:1;min-width:0;overflow-wrap:anywhere}
.opt i{font:normal 12px var(--mono);color:var(--muted)}
.opts .none{padding:10px 8px;color:var(--muted);font-size:13px}
.active{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px}
.achip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 8px 4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.achip span{opacity:.7}
.achip em{font-style:normal;font-weight:400;opacity:.75}
@media (max-width:640px){
  .pop{position:fixed;inset:auto 0 0 0!important;width:auto;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .opts{max-height:55vh}
}
/* Hero: destaques em rodízio, trailer mudo ao fundo; a barra de progresso da miniatura é o relógio do rodízio */
/* tela de cinema: sempre escura, mesmo no tema claro */
.hero,.sband,.curator{--bg:#121019;--fg:#eeeaf4;--muted:#b4adc4;--surface:#1b1824;--raise:#252131;--line:#3a3448;--accent:#f4a640;--on-accent:#1a1206;color-scheme:dark;color:var(--fg)}
.hero{position:relative;overflow:hidden;isolation:isolate;min-height:clamp(460px,66vh,680px);display:flex;align-items:flex-end;background:var(--bg)}
.hero[hidden]{display:none}
/* ao rolar, a hero sobe até sobrar só a faixa (--band) e gruda sob o cabeçalho; --p vai de 0 (cheia) a 1 (faixa) */
.hero{--band:128px;position:sticky;z-index:4}
.hero-bg{transition:top .35s}
.hero.stuck .hero-bg{top:calc(100% - var(--band))}
.hero-in{opacity:calc(1 - var(--p,0)*1.6)}
.hero.stuck .hero-in{visibility:hidden}
.hero::before{content:"";position:absolute;inset:auto 0 0;height:var(--band);z-index:-1;pointer-events:none;opacity:calc((var(--p,0) - .6)*2.5);background:linear-gradient(to right,color-mix(in srgb,var(--bg) 82%,transparent) 0%,color-mix(in srgb,var(--bg) 35%,transparent) 55%,color-mix(in srgb,var(--bg) 15%,transparent));border-bottom:1px solid var(--line)}
.hero.stuck::after{opacity:0}
/* coberta pela faixa de uma sessão: some, para não aparecer no vão entre uma faixa e outra */
.hero.covered{visibility:hidden}
.hero::after{transition:opacity .35s}
.hero-mini{position:absolute;inset:auto 0 0;height:var(--band);box-sizing:border-box;display:flex;align-items:center;gap:16px;opacity:calc((var(--p,0) - .75)*4);visibility:hidden}
.hero.stuck .hero-mini,.hero-mini:focus-within{visibility:visible}
.hero-mini .t{min-width:0;flex:1;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:0}
.hero-mini .t b{display:block;font:900 clamp(26px,3.6vw,44px)/.9 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-mini .t small{display:block;margin-top:6px;color:var(--muted);font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-mini .acts{display:flex;gap:8px;align-items:center;flex:none}
.hero-bg{position:absolute;inset:0;z-index:-2;container-type:size;background:#000}
.hero-layer{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.hero-layer.on{opacity:1}
.hero-layer>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(28px) saturate(1.3) brightness(.8);transform:scale(1.25)}
.hero-layer video,.hero-layer iframe{position:absolute;opacity:0;transition:opacity 1.2s;border:0;pointer-events:none}
.hero-layer video{inset:0;width:100%;height:100%;object-fit:cover}
.hero-layer iframe{top:50%;left:50%;width:max(100cqw,177.78cqh);height:max(56.25cqw,100cqh);translate:-50% -50%;scale:1.4}
.hero-layer .ready{opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(to top,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 28%,transparent 62%),
  linear-gradient(to right,color-mix(in srgb,var(--bg) 88%,transparent) 0%,color-mix(in srgb,var(--bg) 35%,transparent) 45%,transparent 70%)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:48px 28px;width:100%;box-sizing:border-box}
.hero-info{max-width:640px;animation:heroIn .7s both}
@keyframes heroIn{from{opacity:0;translate:0 14px}}
.hero-kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero-kick span{width:8px;height:8px;border-radius:50%;background:var(--d)}
.hero h2{font:900 clamp(48px,8.5vw,112px)/.84 var(--display);text-transform:uppercase;margin:12px 0 0;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:-.005em}
.hero-aka{color:var(--muted);font-size:14px;margin-top:8px}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font-size:15px}
.hero-meta span:not(:last-child)::after{content:"·";margin-left:14px;color:var(--muted)}
.hero-watch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:var(--muted)}
.hero-watch a{color:var(--fg);font-weight:600;text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.hero-watch a:hover{background:var(--accent);color:var(--on-accent)}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hero-ctrl{display:flex;gap:6px}
.hbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--fg);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.hbtn:hover{border-color:var(--muted)}
.hbtn svg{width:16px;height:16px;fill:currentColor}
.hero-thumbs{display:flex;gap:8px}
.hthumb{position:relative;width:62px;aspect-ratio:2/3;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--raise);opacity:.5;transition:opacity .2s,translate .2s;box-shadow:var(--shadow)}
.hthumb:hover{opacity:.85}
.hthumb[aria-current="true"]{opacity:1;translate:0 -6px;outline:2px solid var(--accent);outline-offset:2px}
.hthumb img,.hthumb .gen{width:100%;height:100%;object-fit:cover;display:block}
.hthumb .gen b{font-size:11px!important}
.hthumb .gen span{display:none}
.hthumb i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.hthumb[aria-current="true"] i{animation:heroProg var(--dur,18s) linear forwards}
.hero.paused .hthumb i{animation-play-state:paused}
@keyframes heroProg{to{width:100%}}
@media (max-width:760px){
  .hero{min-height:auto}
  .hero-in{grid-template-columns:minmax(0,1fr);padding-top:180px;gap:18px}
  .hero-side{flex-direction:row-reverse;justify-content:space-between;align-items:center}
  .hero-thumbs{overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none;flex:1;min-width:0}
  .hero-ctrl{flex:none}
  .hthumb{width:44px;flex:none}
  .hero,.sband{--band:96px}
  .hero-mini{gap:10px}
  .hero-mini .acts .btn:not(.primary){display:none}
  .hero-mini .acts .btn.primary{padding:0;width:38px;height:38px;justify-content:center}
  .hero-mini .acts .btn.primary span{display:none}
  .hero-mini .acts{gap:6px}
  .hero-mini .t b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.hero-info{animation:none}}
/* Faixa de cada sessão (na visão de todas): o formato da hero recolhida, grudada sob o cabeçalho enquanto a sessão passa */
body{overflow-x:clip}
.sband{--band:128px;position:sticky;top:var(--hdr,0px);z-index:4;height:var(--band);margin:0 calc(50% - 50vw) 20px;overflow:hidden;isolation:isolate;background:var(--bg);border-bottom:1px solid var(--line)}
.sband::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to right,color-mix(in srgb,var(--bg) 82%,transparent) 0%,color-mix(in srgb,var(--bg) 35%,transparent) 55%,color-mix(in srgb,var(--bg) 15%,transparent))}
.sband .hero-mini{opacity:1;visibility:visible}
.hero-mini .t small span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--d);margin-right:8px;vertical-align:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Página do curador: retrato impresso em papel, nome e bio; tela sempre escura, como a hero */
.curator{background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
.curator[hidden]{display:none}
.curator .wrap{display:grid;grid-template-columns:minmax(240px,400px) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:44px 48px}
.cur-photo{position:relative;margin:0;background:#fbfaf7;padding:14px 14px 42px;border-radius:2px;box-shadow:var(--shadow);rotate:-1.5deg}
.cur-photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}

.cur-back{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.cur-back:hover{color:var(--accent)}
.cur-kick{margin-top:22px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.curator h1{font:900 clamp(52px,9vw,120px)/.84 var(--display);text-transform:uppercase;margin:10px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.cur-facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:16px;font:13px var(--mono);color:var(--muted)}

.cur-bio{display:grid;gap:12px;margin-top:24px;max-width:62ch;font-size:16px;line-height:1.65}
.cur-bio p{margin:0}
.cur-bio p:first-child::first-letter{float:left;font:900 68px/.8 var(--display);color:var(--accent);margin:6px 10px 0 0}
@media (max-width:760px){
  .curator .wrap{grid-template-columns:minmax(0,1fr);padding-block:28px 36px}
  .cur-photo{width:min(100%,340px);justify-self:center}
  .cur-kick{margin-top:14px}
}
/* Rodapé */
.foot{border-top:1px solid var(--line);padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot a{color:var(--fg);text-decoration:none;font-weight:600}
.foot a:hover{color:var(--accent)}
/* Curadoria na ficha */
.curlinks{display:flex;gap:8px;flex-wrap:wrap}
.curlink{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--raise)}
.curlink:hover{border-color:var(--accent)}
.curlink img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:center 30%;background:#fbfaf7}
</style>

const CURATORS = [{"id":"gisele-britto","name":"Gisele Britto","role":"Curadora","photo":"curadores/gisele-britto.jpg","default":true,"bio":["Gisele é uma personagem de contrastes. Prática no cotidiano, espontânea nos gestos e atenta aos detalhes, ela transita entre a simplicidade das coisas concretas e a complexidade silenciosa do mundo interior. Tem o humor de quem não precisa transformar tudo em drama, mas carrega a profundidade de quem sabe que a vida raramente se resume àquilo que acontece na superfície.","Se fosse uma personagem de cinema, não seria apresentada por uma narração explicativa, mas por uma sequência de pequenos gestos, diálogos despretensiosos, silêncios e olhares que dizem mais do que as palavras. Sua história não estaria necessariamente nos grandes acontecimentos, mas nas contradições, nas escolhas e na maneira particular de habitar o mundo.","Gisele tem a matéria de uma personagem que não se deixa resumir a um único traço. Entre razão e sensibilidade, leveza e intensidade, familiaridade e mistério, existe uma personalidade que ganha contornos à medida que a câmera se aproxima.","Ela não é um enigma à espera de uma solução. É uma história que não perde a complexidade quando alguém acredita ter compreendido seu enredo. Como nos bons filmes, há sempre uma diferença entre aquilo que se vê, aquilo que se sente e aquilo que permanece depois que a tela escurece."]}];

let POSTERS = {};

const norm = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

MOVIES.forEach((m,i)=>{

  const w=[...stream,...m.flags]; if((m.watch||[]).some(o=>o.t==="Aluguel"||o.t==="Compra")) w.push("Aluguel ou compra");

  m.hay=norm([m.title,...m.aka,m.year,...m.genres,...m.countries,m.cast,...m.directors,...m.studios,...m.stream,...m.flags,...m.cats.map(c=>CAT[c].name),...m.cur.map(c=>CUR[c].name),m.kind].join(" "));

const FACETS = [

];
const state = {cat:"all", cur:null, q:"", sel:{g:new Set(),r:new Set(),p:new Set(),c:new Set(),d:new Set(),w:new Set(),k:new Set()}, sort:"default", open:{}, pop:null};
try{ const s=JSON.parse(localStorage.getItem("cine-sort")); if(s) state.sort=s; }catch(e){}
// rotas: #<sessão>, #curador/<id> e #curador/<id>/<sessão>
function parseHash(){
  const p=decodeURIComponent(location.hash.slice(1)).split("/"), cur=p[0]==="curador"&&CUR[p[1]]?p[1]:null, c=cur?p[2]:p[0];
  if(cur!==state.cur){ state.q=""; FACETS.forEach(f=>state.sel[f.k].clear()); }
  state.cur=cur; state.cat=CAT[c]?c:"all";
}
function writeHash(){
  const h=[...(state.cur?["curador",state.cur]:[]), ...(state.cat!=="all"?[state.cat]:[])].join("/");
  try{ history.replaceState(null,"",h?"#"+h:location.pathname+location.search); }catch(_){}

parseHash();

const $ = id => document.getElementById(id);

function matches(m, skip){
  if (state.cur && !m.cur.includes(state.cur)) return false;
  if (state.cat!=="all" && !m.cats.includes(state.cat)) return false;
  if (state.q){ const words=norm(state.q).split(/\s+/).filter(Boolean); if(!words.every(w=>m.hay.includes(w))) return false; }
  for (const f of FACETS){ if (f.k===skip) continue; for (const v of state.sel[f.k]) if(!m.tags[f.k].includes(v)) return false; }
  return true;
}
function sorted(list){
  const l=[...list];
  if(state.sort==="title") l.sort((a,b)=>norm(a.title).localeCompare(norm(b.title)));
  if(state.sort==="new") l.sort((a,b)=>(b.year||0)-(a.year||0));
  if(state.sort==="old") l.sort((a,b)=>(a.year||9999)-(b.year||9999));
  return l;
}

function coverHTML(m, big){

function renderCats(){
  const base = MOVIES.filter(m=>!state.cur || m.cur.includes(state.cur));
  const counts = {all:base.length}; CATS.forEach(c=>counts[c.id]=base.filter(m=>m.cats.includes(c.id)).length);

}
function facetEntries(f){
  const cnt = new Map();
  MOVIES.forEach(m=>{ if(matches(m,f.k)) m.tags[f.k].forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)); });
  state.sel[f.k].forEach(v=>{ if(!cnt.has(v)) cnt.set(v,0); });
  return [...cnt].sort(f.sort==="key"?(a,b)=>a[0].localeCompare(b[0]):(a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"pt"));
}
const caret = `<svg viewBox="0 0 12 12"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>`;
function renderFilters(){
  $("filters").innerHTML = FACETS.map(f=>{
    const sel=[...state.sel[f.k]], n=sel.length;

function renderOpts(){

// o popover se ancora no botão via CSS anchor positioning; sem suporte, posiciona à mão
const ANCHOR = CSS.supports("top","anchor(bottom)");
function positionPop(){
  if(ANCHOR || !state.pop || matchMedia("(max-width:640px)").matches) return;
  const b=document.querySelector(`.fbtn[data-facet="${state.pop}"]`), pop=$("pop");
  if(!b) return;
  const r=b.getBoundingClientRect();
  pop.style.left = Math.max(16, Math.min(r.left, innerWidth - pop.offsetWidth - 16)) + "px";
  pop.style.top = (r.bottom + 8) + "px";
}
function openPop(k){
  state.pop=k; const f=FACETS.find(x=>x.k===k);
  $("popTitle").textContent=f.name; $("popq").value="";
  $("popq").hidden = facetEntries(f).length <= 12;
  setExpanded(); renderOpts();
  const pop=$("pop"), b=document.querySelector(`.fbtn[data-facet="${k}"]`);
  if(!pop.matches(":popover-open")){ try{ pop.showPopover({source:b}); }catch(_){ pop.showPopover(); } }

}

// só troca aria-expanded: recriar os botões entre pointerdown e click faria o clique se perder
function setExpanded(){ document.querySelectorAll(".fbtn").forEach(b=>b.setAttribute("aria-expanded", b.dataset.facet===state.pop)); }
// light dismiss e Esc fecham o popover sozinhos (e devolvem o foco); o estado acompanha pelo beforetoggle
let closedAt={k:null,t:0};
$("pop").addEventListener("beforetoggle", e=>{

  closedAt={k:state.pop,t:performance.now()}; state.pop=null; setExpanded();
});
addEventListener("resize", positionPop); addEventListener("scroll", positionPop, {passive:true});
function render(){
  renderCats(); renderFilters(); renderOpts(); renderCurator(); renderHero();

  const groups = state.cat==="all" ? CATS.map(c=>({c, items:list.filter(m=>m.cats.includes(c.id))})).filter(g=>g.items.length) : [{c:CAT[state.cat], items:list}];

      <div class="grid">${items.map(cardHTML).join("")}</div></section>`).join("");

// fora do Artifact (GitHub Pages, arquivo local) os /_blob/ não existem: o trailer vem embutido do YouTube
const EMBED = location.protocol==="file:" || location.hostname.endsWith("github.io");
const hasTrailer = m => EMBED ? !!m.ytt : !!m.tr;
function trailerURL(m){ return m.yt ? `https://www.youtube.com/watch?v=${m.yt}` : `https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+" "+(m.year||"")+" trailer")}`; }

  const tagBtn = (k,v)=>`<button class="chip" type="button" data-f="${k}" data-v="${esc(v)}" data-close>${esc(v)}</button>`;

document.addEventListener("click", e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  if (t.dataset.facet){
    const k=t.dataset.facet;
    // sem invoker nativo, o pointerdown no próprio botão já fechou por light dismiss: não reabre
    if(closedAt.k===k && performance.now()-closedAt.t<400) return;
    state.pop===k ? closePop() : openPop(k); return; }
  if (t.dataset.close!==undefined && t.closest("dialog")) $("dlg").close();
  if (t.classList.contains("card")) return openMovie(MOVIES[+t.dataset.i], !!e.target.closest(".play"));
  if (t.dataset.c){ state.cat = (t.classList.contains("catpill")||state.cat!==t.dataset.c)?t.dataset.c:"all"; writeHash(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if (t.dataset.f){
    const k=t.dataset.f, s=state.sel[k], v=t.dataset.v, single=FACETS.find(f=>f.k===k).single;
    if(t.closest("dialog")){ if(single) s.clear(); s.add(v); }
    else if(s.has(v)) s.delete(v);
    else { if(single) s.clear(); s.add(v); }
    render(); return; }
  if (t.dataset.more){ state.open[t.dataset.more]=!state.open[t.dataset.more]; renderFilters(); return; }
  if (t.dataset.s){ state.sort=t.dataset.s; try{localStorage.setItem("cine-sort",JSON.stringify(state.sort))}catch(_){} render(); }
});

const shuffle = l => { for(let i=l.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [l[i],l[j]]=[l[j],l[i]]; } return l; };
function heroPick(){
  const ok = m => hasTrailer(m) && m.poster && (state.cat==="all" || m.cats.includes(state.cat));
  const l = shuffle(MOVIES.filter(m=>ok(m) && FEATURED.includes(m.id)));
  if(l.length<6) l.push(...shuffle(MOVIES.filter(m=>ok(m) && !l.includes(m))).slice(0, 6-l.length));
  return l.slice(0,6);
}

  const filtering = state.q || FACETS.some(f=>state.sel[f.k].size) || state.cur;
  $("hero").hidden = !!filtering;
  if(filtering){ hero.key=null; $("heroBg").innerHTML=""; return; }
  stickSoon();
  if(hero.key===state.cat){ heroCovers(); return; }
  hero.key=state.cat; hero.list=heroPick(); hero.nPosters=-1;
  if(!hero.list.length){ $("hero").hidden=true; return; }
  $("heroThumbs").innerHTML = hero.list.map((m,k)=>`<button class="hthumb" type="button" data-h="${k}" aria-label="Destaque ${k+1}: ${esc(m.title)}"><span class="th"></span><i></i></button>`).join("");
  heroCovers(); heroShow(0);
}
// capas chegam depois (posters.json); preenche sem recriar os botões, para não reiniciar a barra de progresso
function heroCovers(){
  const n=Object.keys(POSTERS).length; if(n===hero.nPosters) return; hero.nPosters=n;
  document.querySelectorAll("#heroThumbs .hthumb").forEach(b=>{ b.querySelector(".th").innerHTML=coverHTML(hero.list[+b.dataset.h]); });
  const img=document.querySelector("#heroBg .hero-layer:last-child > img"), m=hero.list[hero.i];
  if(img && !img.getAttribute("src") && POSTERS[m.id]) img.src=POSTERS[m.id];
}
// links diretos: primeiro assinatura/grátis; sem isso, aluguel/compra; sem nada, o filme completo no YouTube
function heroWatch(m){
  const w=m.watch||[], free=w.filter(o=>o.t==="Assinatura"||o.t.startsWith("Grátis")), paid=w.filter(o=>o.t==="Aluguel"||o.t==="Compra");
  const uniq=l=>l.filter((o,k)=>l.findIndex(x=>x.n===o.n)===k).slice(0,4);
  const links=l=>uniq(l).map(o=>`<a href="${esc(o.u)}" target="_blank" rel="noopener">${esc(o.n)}</a>`).join("");
  if(free.length) return `<div class="hero-watch"><span>Assista em</span>${links(free)}</div>`;
  if(paid.length) return `<div class="hero-watch"><span>Alugue ou compre em</span>${links(paid)}</div>`;
  if(m.flags.includes("Completo no YouTube")) return `<div class="hero-watch"><span>Assista em</span><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+" "+(m.year||"")+" full movie")}" target="_blank" rel="noopener">YouTube</a></div>`;
  return "";
}
function heroShow(i){
  hero.i=i; const m=hero.list[i], c=state.cat==="all"?m.cats[0]:state.cat;
  const meta=[m.year, m.directors[0], m.countries.slice(0,2).join(", "), m.genres.slice(0,2).join(", ")].filter(Boolean);
  $("heroInfo").innerHTML = `<div class="hero-kick"><span style="--d:var(--c-${c})"></span>Em destaque · ${esc(CAT[c].name)}</div>
    <h2>${esc(m.title)}</h2>${m.aka[0]?`<div class="hero-aka">${esc(m.aka[0])}</div>`:""}
    <div class="hero-meta">${meta.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    ${heroWatch(m)}
    <div class="hero-actions"><button class="btn primary" type="button" data-hopen="play">${ICON.play}Ver trailer com som</button><button class="btn" type="button" data-hopen>Ficha do filme</button></div>`;
  $("heroMini").innerHTML = miniHTML(m, `Em destaque · ${esc(meta.slice(0,2).join(" · "))}`);
  // reinicia a animação de entrada do texto
  const info=$("heroInfo"); info.style.animation="none"; info.offsetWidth; info.style.animation="";
  document.querySelectorAll("#heroThumbs .hthumb").forEach(b=>{
    const on=+b.dataset.h===i; b.setAttribute("aria-current",on);
    if(on){ const bar=document.createElement("i"); b.querySelector("i").replaceWith(bar); b.scrollIntoView({block:"nearest",inline:"nearest"}); }
  });
  const layer=document.createElement("div"); layer.className="hero-layer";
  layer.innerHTML=`<img alt="" ${POSTERS[m.id]?`src="${POSTERS[m.id]}"`:""}>`;
  $("heroBg").append(layer);
  requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add("on")));
  setTimeout(()=>{ [...$("heroBg").children].slice(0,-1).forEach(x=>x.remove()); }, 1000);
  heroApply();
}
// conteúdo da faixa (hero recolhida e faixas das sessões): kick já escapado, título, trailer, ficha, som e pausa
const miniHTML = (m, kick) => `<button class="t" type="button" data-hopen><small>${kick}</small><b>${esc(m.title)}</b></button>
    <div class="acts"><button class="btn primary" type="button" data-hopen="play" aria-label="Ver trailer com som">${ICON.play}<span>Trailer</span></button><button class="btn" type="button" data-hopen>Ficha</button>
    <button class="hbtn" data-hctl="mute" type="button"></button><button class="hbtn" data-hctl="pause" type="button"></button></div>`;
function heroMedia(layer, m){
  if(EMBED){
    const f=document.createElement("iframe");
    f.src=`https://www.youtube-nocookie.com/embed/${m.ytt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${m.ytt}&start=6&playsinline=1&rel=0&iv_load_policy=3&disablekb=1&enablejsapi=1`;
    f.allow="autoplay; encrypted-media"; f.tabIndex=-1; f.title="";
    f.onload=()=>{ f.contentWindow.postMessage(JSON.stringify({event:"listening",id:m.ytt,channel:"widget"}),"*"); stripsApply(); };
    layer.append(f); return f;
  }
  const v=document.createElement("video");
  Object.assign(v,{muted:true,loop:true,playsInline:true,preload:"auto",src:m.tr});
  v.addEventListener("loadedmetadata", ()=>{ v.currentTime=Math.min(12, v.duration*.12); }, {once:true});
  v.addEventListener("playing", ()=>v.classList.add("ready"), {once:true});
  layer.append(v); return v;
}
// o vídeo do YouTube só aparece depois de alguns segundos tocando (quando o título já sumiu)
// e some ao pausar, carregar ou terminar, para a interface do player nunca ficar à vista
addEventListener("message", e=>{
  if(!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname)) return;
  let d; try{ d=JSON.parse(e.data); }catch(_){ return; }
  const st = d.event==="onStateChange" ? d.info : d.info?.playerState;
  if(st===undefined) return;
  const f=[...document.querySelectorAll(".hero-layer iframe")].find(x=>x.contentWindow===e.source); if(!f) return;
  clearTimeout(f._reveal);
  if(st===1) f._reveal=setTimeout(()=>f.classList.add("ready"), 3500);
  else f.classList.remove("ready");
});
const ytCmd = (f, func) => f.contentWindow?.postMessage(JSON.stringify({event:"command",func,args:[]}), "*");
// toca ou pausa o trailer da última camada de um fundo (carrega o vídeo só na primeira vez que for tocar)
function mediaSet(bg, m, run, muted){
  const layer=bg.lastElementChild;
  if(layer && run && !layer.querySelector("video,iframe")) heroMedia(layer, m);
  const el=layer?.querySelector("video,iframe");
  if(el?.tagName==="VIDEO"){ el.muted=muted; run ? el.play().catch(()=>{}) : el.pause(); }
  else if(el){ ytCmd(el, run?"playVideo":"pauseVideo"); ytCmd(el, muted?"mute":"unMute"); }
}
function ctlIcons(root, s, what){
  root.querySelectorAll('[data-hctl="pause"]').forEach(b=>{ b.innerHTML=s.paused?ICON.play:ICON.pause; b.setAttribute("aria-label", (s.paused?"Retomar ":"Pausar ")+what); });
  root.querySelectorAll('[data-hctl="mute"]').forEach(b=>{ b.innerHTML=s.muted?ICON.muted:ICON.sound; b.setAttribute("aria-label", s.muted?"Ativar som do trailer":"Silenciar trailer"); });
}
// só um trailer com som por vez
function unmute(s){ hero.muted=true; Object.values(bands).forEach(b=>b.muted=true); s.muted=false; }
function heroApply(){
  const run = !hero.paused && hero.visible && !hero.covered && !document.hidden && !$("dlg").open && !$("hero").hidden;
  $("hero").classList.toggle("paused", !run);
  mediaSet($("heroBg"), hero.list[hero.i], run, hero.muted);
  ctlIcons($("hero"), hero, "destaques");
}
const stripsApply = () => { heroApply(); bandsApply(); };
$("heroThumbs").addEventListener("animationend", e=>{ if(e.animationName==="heroProg") heroShow((hero.i+1)%hero.list.length); });
$("heroThumbs").addEventListener("click", e=>{ const b=e.target.closest("[data-h]"); if(!b) return; if(!RM) hero.paused=false; heroShow(+b.dataset.h); });
$("hero").addEventListener("click", e=>{
  const o=e.target.closest("[data-hopen]"); if(o) return openMovie(hero.list[hero.i], o.dataset.hopen==="play");
  const c=e.target.closest("[data-hctl]"); if(!c) return;
  if(c.dataset.hctl==="pause") hero.paused=!hero.paused; else if(hero.muted) unmute(hero); else hero.muted=true;
  stripsApply();
});
new IntersectionObserver(([e])=>{ hero.visible=e.isIntersecting; heroApply(); }, {threshold:0}).observe($("hero"));
// ---- Faixas das sessões: um filme de cada sessão, com trailer mudo ao fundo, na visão de todas ----
const bands = {};  // sessão -> {m, paused, muted}; o filme fica o mesmo entre renderizações
function bandPick(c){
  const taken = new Set([...hero.list, ...Object.values(bands).map(b=>b.m)]);
  const l = shuffle(MOVIES.filter(m=>hasTrailer(m) && m.poster && m.cats.includes(c) && !taken.has(m)));
  return l.find(m=>FEATURED.includes(m.id)) || l[0];
}
function bandHTML(c){
  const b = bands[c.id] ??= {m:bandPick(c.id), paused:RM, muted:true}, m=b.m;
  if(!m) return "";
  const kick=`<span style="--d:var(--c-${c.id})"></span>${esc([c.name, m.year, m.directors[0]].filter(Boolean).join(" · "))}`;
  return `<div class="sband" data-band="${c.id}" role="region" aria-label="Destaque de ${esc(c.name)}">
      <div class="hero-bg" aria-hidden="true"><div class="hero-layer on"><img alt="" ${POSTERS[m.id]?`src="${POSTERS[m.id]}"`:""}></div></div>
      <div class="wrap hero-mini">${miniHTML(m, kick)}</div></div>`;
}
function bandsApply(){
  document.querySelectorAll(".sband").forEach(el=>{
    const b=bands[el.dataset.band], run=!b.paused && el._vis && !document.hidden && !$("dlg").open;
    mediaSet(el.querySelector(".hero-bg"), b.m, run, b.muted);
    ctlIcons(el, b, "trailer");
  });
}
// toca só a faixa que está pelo menos metade à vista
const bandIO = new IntersectionObserver(es=>{ es.forEach(e=>e.target._vis=e.isIntersecting); bandsApply(); }, {threshold:.5});
$("main").addEventListener("click", e=>{
  const el=e.target.closest(".sband"); if(!el) return;
  const b=bands[el.dataset.band];
  const o=e.target.closest("[data-hopen]"); if(o) return openMovie(b.m, o.dataset.hopen==="play");
  const c=e.target.closest("[data-hctl]"); if(!c) return;
  if(c.dataset.hctl==="pause") b.paused=!b.paused; else if(b.muted) unmute(b); else b.muted=true;
  stripsApply();
});
// top negativo: a hero rola até restar a faixa e então gruda logo abaixo do cabeçalho
function heroStick(){
  const hdr=document.querySelector("header.top").getBoundingClientRect().bottom;
  document.documentElement.style.setProperty("--hdr", hdr+"px");
  const h=$("hero"); if(h.hidden) return;
  const band=document.querySelector(".sband"), covered=!!band && band.getBoundingClientRect().top<=hdr+1;
  if(covered!==hero.covered){ hero.covered=covered; h.classList.toggle("covered", covered); heroApply(); }
  const travel=h.offsetHeight - parseFloat(getComputedStyle(h).getPropertyValue("--band"));
  h.style.top=(hdr - travel)+"px";
  const p=Math.min(1, Math.max(0, (hdr - h.getBoundingClientRect().top)/travel));
  h.style.setProperty("--p", p.toFixed(3)); h.classList.toggle("stuck", p>.98);
}
let stickRaf=0; const stickSoon=()=>{ cancelAnimationFrame(stickRaf); stickRaf=requestAnimationFrame(heroStick); };
addEventListener("scroll", stickSoon, {passive:true}); addEventListener("resize", stickSoon);
new ResizeObserver(stickSoon).observe($("hero"));
document.addEventListener("visibilitychange", stripsApply);
let qt; $("q").addEventListener("input", e=>{ clearTimeout(qt); qt=setTimeout(()=>{state.q=e.target.value.trim(); render();},90); });
$("clear").onclick=()=>{ $("q").value=""; state.q=""; render(); $("q").focus(); };
$("reset").onclick=()=>{ $("q").value=""; state.q=""; FACETS.forEach(f=>state.sel[f.k].clear()); render(); };
$("random").onclick=()=>{ const l=MOVIES.filter(m=>matches(m)); const pool=l.length?l:MOVIES; openMovie(pool[Math.floor(Math.random()*pool.length)]); };
$("popq").addEventListener("input", renderOpts);
$("popClear").onclick=()=>{ state.sel[state.pop].clear(); render(); };
document.addEventListener("keydown", e=>{ if(e.key==="/" && document.activeElement!==$("q") && !$("dlg").open){ e.preventDefault(); $("q").focus(); } });
$("tagline").innerHTML = `${MOVIES.length} filmes de culto · ${new Set(MOVIES.flatMap(m=>m.countries)).size} países · curadoria de ${CURATORS.map(c=>`<a href="#curador/${c.id}">${esc(c.name)}</a>`).join(" e ")}`;

render();
fetch("posters.json").then(r=>r.ok?r.json():{}).then(p=>{ POSTERS=p; render(); }).catch(()=>{});
</script>

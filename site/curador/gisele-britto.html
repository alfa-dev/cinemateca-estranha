<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfilePage","url":"https://alfa-dev.github.io/cinemateca-estranha/site/curador/gisele-britto.html","mainEntity":{"@type":"Person","name":"Gisele Britto","jobTitle":"Curadora","description":"Gisele é uma personagem de contrastes. Prática como uma manhã de segunda, teatral como um último ato, atenta ao detalhe que todo mundo deixou passar. Não economiza drama: transforma um fim de tarde em cena, uma conversa em diálogo de roteiro, uma taça de vinho tinto em plano-sequência. Nela, nada se resume à superfície. Tudo tem fundo, e o fundo é sempre mais escuro do que parece. Escolheu 248 filmes perfeitos para a madrugada fria e chuvosa, quando a cidade dorme e só a luz da tela insiste em ficar acordada. Atravessou 42 países e mais de um século de sombras, de 1916 a 2020, garimpando o que o tempo tentou enterrar: as obras malditas, as esquecidas, as vaiadas na estreia e amadas em segredo depois. Gisele não procura o filme perfeito. Procura o filme que gruda na pele feito garoa, que volta à memória dias depois, no silêncio de um corredor qualquer. Sua curadoria não segue cânone nem algoritmo. Segue o faro, a fumaça, o arrepio. Ela sabe que o estranho não mora longe, mora perto demais, naquilo que a gente aprendeu a não olhar. Por isso suas sessões não explicam, sussurram. Cada filme é uma porta entreaberta no fim de um corredor mal iluminado, e ela confia que você vai ter coragem de empurrar. Gisele não é um enigma à espera de solução. É uma sala escura com o projetor ainda girando, o som da chuva lá fora, o vinho pela metade. Como nos bons filmes, existe sempre uma distância entre o que se vê, o que se sente e o que permanece depois que a tela escurece. É nessa distância, entre um frame e outro, que Gisele mora.","image":"https://alfa-dev.github.io/cinemateca-estranha/site/curadores/gisele-britto-800.webp"}}</script>
